# ─────────────────────────────────────────────────────────────
# Nginx Configuration for VectorShift Pipeline Editor
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Health Check (must be before / block) ────────────────
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── API Reverse Proxy (must be before static assets block) ─
    # /api/pipelines/parse  →  http://backend:8000/pipelines/parse
    # The trailing slash on proxy_pass strips the /api/ prefix.
    location /api/ {
        proxy_pass          http://backend:8000/;
        proxy_http_version  1.1;

        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;

        # Required so CORS headers from FastAPI flow through cleanly
        # DO NOT add proxy_hide_header here — it breaks CORS preflight
        proxy_pass_header   Access-Control-Allow-Origin;
        proxy_pass_header   Access-Control-Allow-Methods;
        proxy_pass_header   Access-Control-Allow-Headers;

        # Handle OPTIONS preflight from browser CORS checks
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            return 204;
        }

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Static Assets — long-lived cache ─────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA Fallback (must be last) ───────────────────────────
    # Every unknown path returns index.html for React client routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
