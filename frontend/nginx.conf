# ─────────────────────────────────────────────────────────────
# Nginx Configuration for VectorShift Pipeline Editor
#
# Responsibilities:
#   1. Serve React SPA static files from /usr/share/nginx/html
#   2. SPA fallback — all unknown routes return index.html
#      (required for client-side React Router)
#   3. Reverse proxy /api/* → FastAPI backend container
#   4. Gzip compression for performance
#   5. Security headers
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;          # Match any hostname (EC2 public IP or domain)

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static Assets — long-lived cache ─────────────────────
    # CRA injects content hashes into filenames (e.g. main.a1b2c3.js)
    # so it's safe to cache these for 1 year.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API Reverse Proxy ─────────────────────────────────────
    # Forwards /api/* → http://backend:8000/*
    # The frontend fetch() calls must use /api/pipelines/parse
    # (see note in submit.js below)
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — increase if pipeline analysis is slow
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;

        # CORS — backend already sends CORS headers, avoid duplication
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # ── SPA Fallback ──────────────────────────────────────────
    # Any path that doesn't match a real file falls back to index.html
    # This is required for React Router client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health Check Endpoint ─────────────────────────────────
    # Used by AWS EC2 load balancers / health checks
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
