# ─────────────────────────────────────────────────────────────
# docker-compose.yml — VectorShift Pipeline Editor
# ─────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vectorshift-backend

    # NOT exposed on host — only reachable inside app-network
    expose:
      - "8000"

    restart: unless-stopped

    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

    # Health check using shell so we get better error messages
    # start_period gives uvicorn time to boot before checks begin
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - app-network


  # ── React Frontend (Nginx) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vectorshift-frontend

    ports:
      - "80:80"

    restart: unless-stopped

    # Wait until backend is confirmed healthy before Nginx starts
    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      - app-network


# ── Shared Internal Network ─────────────────────────────────
networks:
  app-network:
    driver: bridge
